<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Hub</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header>
        
        <h1>Crypto Hub</h1>
        <p>o centro das informações cripto</p>

    </header>

    <div class="search">

        <input type="text" class="rank" id="rank" placeholder="digite o rank de criptos...">
        <button class="btngo" id="btngo"><img src="assets/icons/search.png" alt=""></button>

    </div>

    <div class="display">
        
        <h2>Top criptos</h2>

        <table id="view" class="view">
    
            <tr>
                <th>#</th>
                <th>Nome</th>
                <th>Preço</th>
                <th>Mudanças 24h</th>
                <th>Market cap</th>
                <th>Volume</th>
            </tr>
            
        </table>

    </div>
    
</body>
<script src="./js/main.js" type="module"></script>
</html>
